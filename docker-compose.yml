version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: traceanvaya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: traceanvaya
      POSTGRES_PASSWORD: traceanvaya_password
      POSTGRES_DB: traceanvaya
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceanvaya -d traceanvaya"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: traceanvaya-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql+asyncpg://traceanvaya:traceanvaya_password@postgres:5432/traceanvaya
      - AI_PROVIDER=gemini
      - AI_MODEL=gemini-3.5-flash-lite
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SESSION_SECRET=${SESSION_SECRET:-local-docker-compose-session-secret-change-in-prod}
      - RATE_LIMIT_PER_MINUTE=30
      - SESSION_AI_LIMIT_PER_HOUR=40
      - MAX_CONCURRENT_AI_PER_SESSION=2
      - GLOBAL_AI_LIMIT_PER_HOUR=500
      - TRUST_PROXY_HEADERS=true
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traceanvaya-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_AGENT_URL=http://backend:8000/agent
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
