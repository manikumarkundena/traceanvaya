services:
  - type: web
    name: traceanvaya-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.5-flash-lite
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
