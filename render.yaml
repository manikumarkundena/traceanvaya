services:
  - type: web
    name: traceanvaya-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.5-flash-lite
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OLLAMA_ENABLED
        value: "false"
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: SESSION_AI_LIMIT_PER_HOUR
        value: "40"
      - key: MAX_CONCURRENT_AI_PER_SESSION
        value: "2"
      - key: GLOBAL_AI_LIMIT_PER_HOUR
        value: "500"
      - key: SESSION_TTL_SECONDS
        value: "86400"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: MAX_AGENT_BODY_BYTES
        value: "131072"
      - key: MAX_RAW_EVIDENCE_BYTES
        value: "2097152"
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
